{% extends "base.html" %}
{% block title %}Add User — Admin{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-4">
    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-sm btn-outline-secondary me-3">
        <i class="bi bi-arrow-left"></i> Back
    </a>
    <h4 class="mb-0"><i class="bi bi-person-plus me-2"></i>Add New User</h4>
</div>

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                        <input type="text" name="name" class="form-control" placeholder="e.g. John Smith" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">QMUL Email <span class="text-danger">*</span></label>
                        <input type="email" name="email" class="form-control" placeholder="e.g. j.smith@qmul.ac.uk" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                        <input type="password" name="password" class="form-control" placeholder="Set a temporary password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Role <span class="text-danger">*</span></label>
                        <select name="role" class="form-select" id="roleSelect" required onchange="toggleYearGroup(this.value)">
                            <option value="">-- Select a role --</option>
                            <option value="student">Student</option>
                            <option value="sst_admin">SST Admin</option>
                            <option value="its_staff">ITS Staff</option>
                            <option value="lab_technician">Lab Technician</option>
                            <option value="module_organiser">Module Organiser</option>
                            <option value="admin">System Admin</option>
                        </select>
                    </div>
                    <div class="mb-4" id="yearGroupRow" style="display:none;">
                        <label class="form-label fw-semibold">Year Group</label>
                        <select name="year_group" class="form-select">
                            <option value="">-- Select --</option>
                            <option value="Year 1">Year 1</option>
                            <option value="Year 2">Year 2</option>
                            <option value="Year 3">Year 3</option>
                            <option value="Year 4">Year 4</option>
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary" style="background-color:#003B5C;border-color:#003B5C;">
                            <i class="bi bi-person-plus me-1"></i> Add User
                        </button>
                        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function toggleYearGroup(role) {
    document.getElementById('yearGroupRow').style.display = (role === 'student') ? '' : 'none';
}
toggleYearGroup(document.getElementById('roleSelect').value);
</script>
{% endblock %}
