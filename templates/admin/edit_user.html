{% extends "base.html" %}
{% block title %}Edit User - QMUL Issues & Feedback{% endblock %}

{% block content %}
<h4 class="mb-4"><i class="bi bi-person-gear me-2"></i>Edit User</h4>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">QMUL Email</label>
                <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Reset Password <span class="text-muted small">(leave blank to keep current)</span></label>
                <input type="password" name="password" class="form-control" placeholder="Enter new password">
            </div>
            <div class="mb-3">
                <label class="form-label">Role</label>
                <select name="role" class="form-select" required>
                    <option value="student" {% if user.role == 'student' %}selected{% endif %}>Student</option>
                    <option value="sst_admin" {% if user.role == 'sst_admin' %}selected{% endif %}>SST Admin</option>
                    <option value="its_staff" {% if user.role == 'its_staff' %}selected{% endif %}>ITS Staff</option>
                    <option value="lab_technician" {% if user.role == 'lab_technician' %}selected{% endif %}>Lab Technician</option>
                    <option value="module_organiser" {% if user.role == 'module_organiser' %}selected{% endif %}>Module Organiser</option>
                    <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
