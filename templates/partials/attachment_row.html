{% set previewable = att.file_name.lower().endswith('.pdf') or att.file_name.lower().endswith('.png') or att.file_name.lower().endswith('.jpg') or att.file_name.lower().endswith('.jpeg') %}
<div class="d-flex align-items-center gap-3 py-2 border-bottom">
    <i class="bi bi-file-earmark{% if att.file_name.lower().endswith('.pdf') %}-pdf text-danger{% elif previewable %}-image text-primary{% else %}-word text-primary{% endif %} fs-5"></i>
    <div class="flex-grow-1">
        <div class="fw-medium">{{ att.file_name }}</div>
        <div class="text-muted small">Uploaded {{ att.uploaded_at[:10] }}</div>
    </div>
    <div class="d-flex gap-2">
        {% if previewable %}
        <a href="{{ url_for('preview_file', attachment_id=att.attachment_id) }}" target="_blank"
           class="btn btn-sm btn-outline-primary">
            <i class="bi bi-eye me-1"></i>Preview
        </a>
        {% endif %}
        <a href="{{ url_for('download_file', attachment_id=att.attachment_id) }}"
           class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-download me-1"></i>Download
        </a>
    </div>
</div>
