{% extends "base.html" %}
{% block title %}Submit Ticket - QMUL Issues & Feedback{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="d-flex align-items-center mb-4">
            <a href="{{ url_for('student_dashboard') }}" class="btn btn-sm btn-outline-secondary me-3">
                <i class="bi bi-arrow-left"></i> Back
            </a>
            <h4 class="mb-0"><i class="bi bi-plus-circle me-2"></i>Submit a Support Ticket</h4>
        </div>

        <div class="card">
            <div class="card-body p-4">
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="category_id" class="form-label">Category <span class="text-danger">*</span></label>
                        <select class="form-select" id="category_id" name="category_id" required>
                            <option value="">-- Select a category --</option>
                            {% for cat in categories %}
                            <option value="{{ cat.category_id }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                        <div class="form-text">Select the category that best describes your issue.</div>
                    </div>

                    <div class="mb-3">
                        <label for="title" class="form-label">Title <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="title" name="title"
                               placeholder="Brief summary of the issue" required maxlength="200">
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="description" name="description" rows="5"
                                  placeholder="Describe the issue in detail. Include location, time, and any error messages."
                                  required></textarea>
                    </div>

                    <div class="mb-4">
                        <label for="evidence" class="form-label">Supporting Evidence (Optional)</label>
                        <input class="form-control" type="file" id="evidence" name="evidence"
                               accept=".pdf,.png,.jpg,.jpeg,.doc,.docx">
                        <div class="form-text">Accepted formats: PDF, PNG, JPEG, DOC. Max 16MB.</div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary" style="background-color: #003B5C; border-color: #003B5C;">
                            <i class="bi bi-send me-1"></i> Submit Ticket
                        </button>
                        <a href="{{ url_for('student_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
